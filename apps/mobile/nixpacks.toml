[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "export EXPO_PROJECT_ROOT=$(pwd)",
  "export METRO_PROJECT_ROOT=$(pwd)",
  "mkdir -p /node_modules || true",
  "npx expo export --platform web"
]

[start]
cmd = "npx serve dist -l 3000"
